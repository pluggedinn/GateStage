# GateStage — ESPHome gate firmware (Seeed XIAO ESP32-C5)
#
# Flash one copy per gate. Pass `gate_id` at flash time (default "1" below):
#   esphome -s gate_id 3 run gate.yaml
#   ./flash-gate.sh 3
# That sets esphome.name to gate-<id> — the gate ID in UDP beacons GateStage listens for.
#
# Hardware (default in this file):
#   - Seeed XIAO ESP32-C5
#   - WS2811 addressable strip, data on D8 (GPIO8)
#   - 12 V strip PSU wired separately; ESP drives data only (share GND with PSU)
#
# LED count: firmware allocates STRIP_MAX_LEDS below (reflash to raise the ceiling).
# Set how many pixels are lit via the "Active LEDs" REST number entity or web UI.
#
# Effects match `lib/effects.ts`: Pulse, Strobe, Color Wipe, Rainbow, Comet.
# All effects respect Active LEDs (shift/animate only the active range).
# Rainbow, Pulse, Color Wipe, and Comet params are runtime-tunable via REST.

substitutions:
  gate_id: "1"

esphome:
  name: gate-${gate_id}
  friendly_name: Gate ${gate_id}
  on_boot:
    # Match runtime LED limit to the flashed strip buffer size.
    - priority: -200
      then:
        - globals.set:
            id: g_max_leds
            value: !lambda |-
              auto *out = id(gate_led).get_output();
              if (out == nullptr) return 0;
              return static_cast<esphome::light::AddressableLight *>(out)->size();
    # Restore runs in light setup(); re-apply after hardware is up (RMT strip).
    - priority: -100
      then:
        - delay: 300ms
        - light.turn_on:
            id: gate_led
            transition_length: 0s
        - script.execute: mask_inactive_leds

esp32:
  board: esp32-c5-devkitc-1
  variant: esp32c5
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

mdns:

wifi:
  networks:
    - ssid: "I dont take naps-5G"
      password: "broccoli"
      priority: 5
    - ssid: "Whoop Racing"
      password: "tinywhoop"
      priority: 10
  band_mode: 5GHZ
  fast_connect: false
  power_save_mode: none
  ap:
    ssid: GateStage-gate-${gate_id}
    password: "tinywhoop"
  on_connect:
    then:
      - delay: 500ms
      - repeat:
          count: 3
          then:
            - script.execute: send_gatestage_beacon
            - delay: 200ms

api:

ota:
  - platform: esphome
  - platform: web_server

web_server:
  port: 80
  version: 3
  local: true

# GateStage presence: broadcast id + RSSI + chip temp. Laptop listens on 9420.
udp:
  id: gatestage_beacon
  port: 9420
  addresses:
    - 255.255.255.255
  on_receive:
    then:
      - if:
          condition:
            lambda: |-
              std::string s(data.begin(), data.end());
              return s.find("\"q\":\"who\"") != std::string::npos;
          then:
            - script.execute: send_gatestage_beacon

# Runtime strip + effect parameters (GateStage sets these via REST)
globals:
  - id: g_max_leds
    type: int
    restore_value: false
    initial_value: "0"
  - id: g_active_leds
    type: int
    restore_value: true
    initial_value: "60"
  - id: g_rainbow_speed
    type: int
    restore_value: false
    initial_value: "10"
  - id: g_rainbow_width
    type: int
    restore_value: false
    initial_value: "50"
  - id: g_pulse_transition_ms
    type: int
    restore_value: false
    initial_value: "1000"
  - id: g_pulse_update_ms
    type: int
    restore_value: false
    initial_value: "1000"
  - id: g_pulse_min_brightness
    type: int
    restore_value: false
    initial_value: "0"
  - id: g_pulse_max_brightness
    type: int
    restore_value: false
    initial_value: "100"
  - id: g_wipe_interval_ms
    type: int
    restore_value: false
    initial_value: "100"
  - id: g_wipe_reverse
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_comet_width
    type: int
    restore_value: false
    initial_value: "8"
  - id: g_comet_count
    type: int
    restore_value: false
    initial_value: "1"
  - id: g_comet_interval_ms
    type: int
    restore_value: false
    initial_value: "40"
  - id: g_comet_max_brightness
    type: int
    restore_value: false
    initial_value: "100"
  - id: g_comet_reverse
    type: bool
    restore_value: false
    initial_value: "false"

number:
  - platform: template
    name: "Active LEDs"
    optimistic: true
    min_value: 1
    max_value: 400
    step: 1
    initial_value: 60
    set_action:
      - globals.set:
          id: g_active_leds
          value: !lambda |-
            int v = (int) x;
            if (v < 1) v = 1;
            if (v > id(g_max_leds)) v = id(g_max_leds);
            return v;
      - script.execute: mask_inactive_leds
  - platform: template
    name: "FX Rainbow Speed"
    optimistic: true
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 10
    set_action:
      - globals.set:
          id: g_rainbow_speed
          value: !lambda "return (int) x;"
  - platform: template
    name: "FX Rainbow Width"
    optimistic: true
    min_value: 1
    max_value: 255
    step: 1
    initial_value: 50
    set_action:
      - globals.set:
          id: g_rainbow_width
          value: !lambda "return (int) x;"
  - platform: template
    name: "FX Pulse Transition"
    optimistic: true
    min_value: 100
    max_value: 30000
    step: 100
    initial_value: 1000
    set_action:
      - globals.set:
          id: g_pulse_transition_ms
          value: !lambda "return (int) x;"
  - platform: template
    name: "FX Pulse Cycle Interval"
    optimistic: true
    min_value: 100
    max_value: 30000
    step: 100
    initial_value: 1000
    set_action:
      - globals.set:
          id: g_pulse_update_ms
          value: !lambda "return (int) x;"
  - platform: template
    name: "FX Pulse Min Brightness"
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    set_action:
      - globals.set:
          id: g_pulse_min_brightness
          value: !lambda "return (int) x;"
  - platform: template
    name: "FX Pulse Max Brightness"
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    set_action:
      - globals.set:
          id: g_pulse_max_brightness
          value: !lambda "return (int) x;"
  - platform: template
    name: "FX Color Wipe Interval"
    optimistic: true
    min_value: 10
    max_value: 5000
    step: 10
    initial_value: 100
    set_action:
      - globals.set:
          id: g_wipe_interval_ms
          value: !lambda "return (int) x;"
  - platform: template
    name: "FX Comet Width"
    optimistic: true
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 8
    set_action:
      - globals.set:
          id: g_comet_width
          value: !lambda "return (int) x;"
  - platform: template
    name: "FX Comet Count"
    optimistic: true
    min_value: 1
    max_value: 32
    step: 1
    initial_value: 1
    set_action:
      - globals.set:
          id: g_comet_count
          value: !lambda "return (int) x;"
  - platform: template
    name: "FX Comet Interval"
    optimistic: true
    min_value: 10
    max_value: 5000
    step: 10
    initial_value: 40
    set_action:
      - globals.set:
          id: g_comet_interval_ms
          value: !lambda "return (int) x;"
  - platform: template
    name: "FX Comet Max Brightness"
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    set_action:
      - globals.set:
          id: g_comet_max_brightness
          value: !lambda "return (int) x;"

switch:
  - platform: template
    name: "FX Color Wipe Reverse"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - globals.set:
          id: g_wipe_reverse
          value: "true"
    turn_off_action:
      - globals.set:
          id: g_wipe_reverse
          value: "false"
  - platform: template
    name: "FX Comet Reverse"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - globals.set:
          id: g_comet_reverse
          value: "true"
    turn_off_action:
      - globals.set:
          id: g_comet_reverse
          value: "false"

script:
  - id: send_gatestage_beacon
    mode: single
    then:
      - udp.write:
          id: gatestage_beacon
          data: !lambda |-
            char buf[160];
            const char *name = App.get_name().c_str();
            const bool have_rssi = !std::isnan(id(wifi_rssi).state);
            const bool have_temp = !std::isnan(id(esp_temp).state);
            int n = 0;
            if (have_rssi && have_temp) {
              n = snprintf(buf, sizeof(buf),
                "{\"v\":1,\"id\":\"%s\",\"rssi\":%.0f,\"tC\":%.1f}",
                name, id(wifi_rssi).state, id(esp_temp).state);
            } else if (have_rssi) {
              n = snprintf(buf, sizeof(buf),
                "{\"v\":1,\"id\":\"%s\",\"rssi\":%.0f}",
                name, id(wifi_rssi).state);
            } else if (have_temp) {
              n = snprintf(buf, sizeof(buf),
                "{\"v\":1,\"id\":\"%s\",\"tC\":%.1f}",
                name, id(esp_temp).state);
            } else {
              n = snprintf(buf, sizeof(buf), "{\"v\":1,\"id\":\"%s\"}", name);
            }
            if (n < 0) return {};
            const size_t len = static_cast<size_t>(n) < sizeof(buf)
              ? static_cast<size_t>(n)
              : sizeof(buf) - 1;
            return std::vector<uint8_t>(buf, buf + len);
  - id: mask_inactive_leds
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(g_active_leds) < id(g_max_leds);'
          then:
            - light.addressable_set:
                id: gate_led
                range_from: !lambda "return id(g_active_leds);"
                range_to: !lambda "return id(g_max_leds) - 1;"
                red: 0%
                green: 0%
                blue: 0%

interval:
  # Solid-color tail mask only (effects clear their own inactive pixels).
  - interval: 32ms
    then:
      - if:
          condition:
            lambda: |-
              if (!id(gate_led).remote_values.is_on()) return false;
              return id(gate_led).get_current_effect_index() == 0;
          then:
            - script.execute: mask_inactive_leds
  - interval: 3s
    then:
      - script.execute: send_gatestage_beacon

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi Signal"
    update_interval: 10s
  - platform: internal_temperature
    id: esp_temp
    name: "ESP Temperature"
    update_interval: 60s

light:
  - platform: esp32_rmt_led_strip
    id: gate_led
    name: "Gate LEDs"
    pin: GPIO8
    # XIAO ESP32-C5 buffer ceiling (no PSRAM). Reflash after editing.
    num_leds: 400
    rgb_order: RGB
    chipset: ws2811
    use_psram: false
    rmt_symbols: 96
    default_transition_length: 0s
    restore_mode: RESTORE_AND_ON
    on_turn_off:
      - lambda: |-
          auto *out = static_cast<esphome::light::AddressableLight *>(id(gate_led).get_output());
          if (out == nullptr) return;
          out->all() = esphome::Color(0, 0, 0);
          out->schedule_show();
    initial_state:
      state: true
      brightness: 5%
      color_mode: rgb
      red: 100%
      green: 0%
      blue: 0%
    effects:
      - addressable_lambda:
          name: Pulse
          update_interval: 50ms
          lambda: |-
            static uint32_t phase_origin = 0;
            const int active = id(g_active_leds);
            const int size = it.size();
            const int count = active < size ? active : size;
            if (count <= 0) return;
            if (initial_run) {
              phase_origin = millis();
              it.range(0, count - 1) = esphome::Color(0, 0, 0);
              if (count < size) it.range(count, size - 1) = esphome::Color(0, 0, 0);
              return;
            }
            const uint32_t now = millis();
            const uint32_t ramp_ms = (uint32_t) id(g_pulse_transition_ms);
            const uint32_t hold_ms = (uint32_t) id(g_pulse_update_ms);
            const uint32_t safe_ramp = ramp_ms < 1 ? 1 : ramp_ms;
            const uint32_t safe_hold = hold_ms < 1 ? 1 : hold_ms;
            const uint32_t cycle_ms = (safe_ramp + safe_hold) * 2;
            const uint32_t cycle = (now - phase_origin) % cycle_ms;
            const float min_b = id(g_pulse_min_brightness) / 100.0f;
            const float max_b = id(g_pulse_max_brightness) / 100.0f;
            float level = min_b;
            if (cycle < safe_ramp) {
              level = min_b + (max_b - min_b) * ((float) cycle / (float) safe_ramp);
            } else if (cycle < safe_ramp + safe_hold) {
              level = max_b;
            } else if (cycle < safe_ramp * 2 + safe_hold) {
              const uint32_t fall = cycle - safe_ramp - safe_hold;
              level = max_b - (max_b - min_b) * ((float) fall / (float) safe_ramp);
            } else {
              level = min_b;
            }
            const uint8_t scale = (uint8_t) (level * 255.0f);
            const esphome::Color lit = current_color * scale;
            it.range(0, count - 1) = lit;
            if (count < size) it.range(count, size - 1) = esphome::Color(0, 0, 0);
      - addressable_lambda:
          name: Strobe
          update_interval: 16ms
          lambda: |-
            static uint32_t phase_origin = 0;
            const int active = id(g_active_leds);
            const int size = it.size();
            const int count = active < size ? active : size;
            if (count <= 0) return;
            if (initial_run) {
              phase_origin = millis();
            }
            // 400ms on/off cycle matches the UI preview (fxStrobe / led-strobe-flash).
            const uint32_t cycle_ms = 400;
            const bool on = ((millis() - phase_origin) % cycle_ms) < (cycle_ms / 2);
            const esphome::Color c = on ? current_color : esphome::Color(0, 0, 0);
            it.range(0, count - 1) = c;
            if (count < size) it.range(count, size - 1) = esphome::Color(0, 0, 0);
      - addressable_lambda:
          name: Rainbow
          update_interval: 16ms
          lambda: |-
            const int speed = id(g_rainbow_speed);
            const int width = id(g_rainbow_width);
            const int active = id(g_active_leds);
            const int size = it.size();
            if (size == 0) return;
            const int count = active < size ? active : size;
            const int safe_width = width < 1 ? 1 : width;
            esphome::light::ESPHSVColor hsv;
            hsv.saturation = 240;
            hsv.value = 255;
            uint16_t hue = (millis() * speed) % 0xFFFF;
            const uint16_t add = 0xFFFF / safe_width;
            for (int i = 0; i < count; i++) {
              hsv.hue = hue >> 8;
              it[i] = hsv;
              hue += add;
            }
            if (count < size) {
              it.range(count, size - 1) = esphome::Color(0, 0, 0);
            }
      - addressable_lambda:
          name: Color Wipe
          update_interval: 16ms
          lambda: |-
            static uint32_t last_add = 0;
            static uint8_t wiping_off = 0;
            static int leds_added = 0;
            const int active = id(g_active_leds);
            const int size = it.size();
            const int count = active < size ? active : size;
            if (count <= 0) return;
            if (initial_run) {
              last_add = 0;
              wiping_off = 0;
              leds_added = 0;
              it.range(0, count - 1) = esphome::Color(0, 0, 0);
              if (count < size) it.range(count, size - 1) = esphome::Color(0, 0, 0);
              return;
            }
            const uint32_t now = millis();
            const uint32_t interval_ms = (uint32_t) id(g_wipe_interval_ms);
            const uint32_t safe_interval = interval_ms < 10 ? 10 : interval_ms;
            if (now - last_add < safe_interval) return;
            last_add = now;
            const bool reverse = id(g_wipe_reverse);
            if (reverse) {
              for (int i = 0; i < count - 1; i++) {
                it[i] = it[i + 1].get();
              }
            } else {
              for (int i = count - 1; i > 0; i--) {
                it[i] = it[i - 1].get();
              }
            }
            // Fill with the selected color, then wipe to off — matches the UI preview (fxWipe).
            const esphome::Color esp_color = wiping_off ? esphome::Color(0, 0, 0) : current_color;
            if (reverse) {
              it[count - 1] = esp_color;
            } else {
              it[0] = esp_color;
            }
            if (++leds_added >= count) {
              leds_added = 0;
              wiping_off = wiping_off ? 0 : 1;
            }
            if (count < size) it.range(count, size - 1) = esphome::Color(0, 0, 0);
      - addressable_lambda:
          name: Comet
          update_interval: 16ms
          lambda: |-
            const int active = id(g_active_leds);
            const int size = it.size();
            const int count = active < size ? active : size;
            if (count <= 0) return;
            int width = id(g_comet_width);
            if (width < 1) width = 1;
            int copies = id(g_comet_count);
            if (copies < 1) copies = 1;
            if (copies > count) copies = count;
            const uint32_t interval_ms = (uint32_t) id(g_comet_interval_ms);
            const uint32_t safe_interval = interval_ms < 10 ? 10 : interval_ms;
            float max_b = id(g_comet_max_brightness) / 100.0f;
            if (max_b < 0.0f) max_b = 0.0f;
            if (max_b > 1.0f) max_b = 1.0f;
            // Paint in true RGB so the strip stays lit at the selected brightness
            // and the comet only boosts on top. ESPHome's slider scale would
            // otherwise make the base look off.
            auto *out = static_cast<esphome::light::AddressableLight *>(id(gate_led).get_output());
            const float slider = id(gate_led).remote_values.get_brightness();
            const float saved_b = id(gate_led).current_values.get_brightness();
            id(gate_led).current_values.set_brightness(1.0f);
            if (out != nullptr) out->update_state(id(gate_led));
            float base_level = slider;
            if (base_level < 0.0f) base_level = 0.0f;
            if (base_level > 1.0f) base_level = 1.0f;
            float peak_level = max_b;
            if (peak_level < base_level) peak_level = base_level;
            const float span = (float) count;
            float head = fmodf((float) millis() / (float) safe_interval, span);
            if (head < 0.0f) head += span;
            if (id(g_comet_reverse)) head = span - head;
            const float spacing = span / (float) copies;
            const float half = (float) width * 0.5f;
            const float pi = 3.14159265f;
            for (int i = 0; i < count; i++) {
              float rel = (float) i - head;
              rel = fmodf(rel, spacing);
              if (rel < 0.0f) rel += spacing;
              float d = rel;
              if (spacing - rel < d) d = spacing - rel;
              float t = 0.0f;
              if (half > 0.0f && d < half) {
                t = 0.5f * (1.0f + cosf(pi * d / half));
              }
              const float level = base_level + (peak_level - base_level) * t;
              it[i] = current_color * (uint8_t) (level * 255.0f);
            }
            if (count < size) it.range(count, size - 1) = esphome::Color(0, 0, 0);
            id(gate_led).current_values.set_brightness(saved_b);
            if (out != nullptr) out->update_state(id(gate_led));
